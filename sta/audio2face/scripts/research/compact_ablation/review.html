<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>James · Matched mouth comparison</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101118;color:#ececf1}*{box-sizing:border-box}body{margin:24px auto;padding:0 24px;max-width:1920px}h1{margin:0 0 8px;font-size:26px}p{color:#b8bbca;line-height:1.5}button,select,input{font:inherit}button,select{padding:8px 12px;border:1px solid #424554;border-radius:7px;background:#242633;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #f2c6a6;outline-offset:3px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}#dialogue{min-height:48px}#panels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}article{min-width:0}h2{font-size:15px;font-weight:600;margin:0 0 8px}.viewport{height:390px;position:relative;border:1px solid #383a47;border-radius:12px;background:radial-gradient(ellipse at 50% 40%,#393746,#191b26)}.viewport canvas{position:absolute;inset:0;display:block;width:100%;height:100%}audio{width:min(620px,100%);display:block;margin:18px 0 12px}#scrub{width:100%;accent-color:#f2c6a6}#snapshots{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#position{font-variant-numeric:tabular-nums;color:#f2c6a6}.error{color:#ffa7a0}@media(max-width:1000px){#panels{grid-template-columns:repeat(2,minmax(0,1fr))}.viewport{height:320px}}
</style></head><body>
<h1>Matched mouth comparison</h1>
<p>The same speech and playback clock drive every face. The reference is full Audio2Face fitted to James’s blendshapes. Compare closures, jaw opening and transitions; the head can be held steady for inspection.</p>
<div class="controls"><label for="clip">Speech sample</label><select id="clip" disabled></select><label><input id="steady" type="checkbox" checked> Hold head steady</label><label><input id="closeup" type="checkbox" checked> Mouth close-up</label></div>
<p id="dialogue"></p><div id="panels"></div>
<audio id="audio" controls preload="auto"></audio><button id="play" type="button" disabled>Play matched speech</button>
<label for="scrub">Frame <span id="position">0</span></label><input id="scrub" type="range" min="0" max="1" step="1" value="0" disabled>
<div id="snapshots" role="group" aria-label="Matched inspection frames"></div>
<img id="gap-plot" alt="Lip-gap trajectories for the same speech and models" style="width:100%;height:auto;display:block;margin-top:18px"><p id="status" role="status">Loading comparison assets…</p>
<script type="module" src="./review.js"></script></body></html>
