name: Mapping research invariants
on:
  pull_request:
    paths:
      - 'sta/audio2face/scripts/research/mediapipe_mapping/**'
      - '.github/workflows/mapping-research.yml'
  push:
    branches: [main]
    paths:
      - 'sta/audio2face/scripts/research/mediapipe_mapping/**'
      - '.github/workflows/mapping-research.yml'
jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install invariant-test dependencies
        run: python -m pip install 'numpy>=1.26' 'scipy>=1.11' 'pillow>=10' 'onnxruntime>=1.18' 'opencv-python-headless>=4.9'
      - name: Check geometry and calibration invariants without model assets
        run: python -m unittest discover -s sta/audio2face/scripts/research/mediapipe_mapping -p 'test_*.py' -v
